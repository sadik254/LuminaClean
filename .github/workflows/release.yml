name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & Package App Bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          chmod +x ./bundle.sh
          ./bundle.sh "${VERSION}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "LuminaClean ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: LuminaClean-v*-macOS.zip
          draft: false
          prerelease: false
          generate_release_notes: true
