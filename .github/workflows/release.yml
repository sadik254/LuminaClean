name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Version Environment
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building LuminaClean version: ${VERSION}"

      - name: Build Release Binary
        run: |
          swift build -c release

      - name: Create macOS App Bundle
        run: |
          APP_NAME="LuminaClean.app"
          MACOS_DIR="$APP_NAME/Contents/MacOS"
          RESOURCES_DIR="$APP_NAME/Contents/Resources"

          mkdir -p "$MACOS_DIR"
          mkdir -p "$RESOURCES_DIR"

          # Copy binary
          BIN_PATH=".build/release/LuminaClean"
          if [ ! -f "$BIN_PATH" ]; then
            BIN_PATH=".build/arm64-apple-macosx/release/LuminaClean"
          fi
          cp "$BIN_PATH" "$MACOS_DIR/LuminaClean"
          chmod +x "$MACOS_DIR/LuminaClean"

          # Copy App Icon if present
          if [ -f "AppIcon.icns" ]; then
            cp "AppIcon.icns" "$RESOURCES_DIR/AppIcon.icns"
          fi

          # Generate Info.plist with injected version
          cat <<EOF > "$APP_NAME/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>LuminaClean</string>
              <key>CFBundleIdentifier</key>
              <string>com.luminaclean.app</string>
              <key>CFBundleName</key>
              <string>LuminaClean</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Create Zip Archive
        run: |
          # Use Apple's ditto to preserve permissions and macOS resource forks
          ZIP_NAME="LuminaClean-${TAG_NAME}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent LuminaClean.app "$ZIP_NAME"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "LuminaClean ${{ env.TAG_NAME }}"
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
